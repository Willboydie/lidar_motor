; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-gui
lib_archive = false
upload_port = COM4
; src_filter paths are relative to the src/ folder, so drop the leading src/
; current_sense/ base (InlineCurrentSense.cpp Clarke/Park + Teensy zero stub) builds
; here; only the STM32G4 backend under current_sense/stm32g4/ is excluded.
; pwm_driver/stm32g4/ is only valid for STM32G4xx builds.
build_src_filter = +<*> -<current_sense/stm32g4/> -<pwm_driver/stm32g4/> -<tests/ldm/garmin_hardware_test.cpp> -<tests/ldm/garmin_hardware_test.hpp> -<tests/ldm/stm32g4_ldm_test.hpp> -<tests/driver/stm32g4_driver_test.hpp> -<tests/driver/stm32g4_center_aligned_test.hpp> -<tests/driver/stm32g4_safe_stop_test.hpp> -<tests/driver/stm32g4_coil_cogging_test.hpp> -<_stm32g4_main_stub.cpp> -<tests/system/> -<tests/sensor/stm32g4_sensor_test.hpp> -<tests/current_sense/> -<hardware_api.h>

[env:stm32g4]
; Stage bench tests (Nucleo G474RE). Switch active test in _stm32g4_main_stub.cpp.
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
; upload_port = COMx
lib_archive = false
build_src_filter =
    -<*>
    +<_stm32g4_main_stub.cpp>
    +<hardware_api.h>
    +<current_sense/InlineCurrentSense.cpp>
    +<current_sense/stm32g4/InlineCurrentSenseSTM32G4.cpp>
    +<sensor/>
    +<filter/LowPassFilter.cpp>
    +<filter/LowPassFilter.hpp>
    +<filter/MeanFilter.cpp>
    +<filter/MeanFilter.hpp>
    +<motor/>
    +<pwm_driver/PWMDriver.cpp>
    +<pwm_driver/PWMDriver.hpp>
    +<pwm_driver/stm32g4/SimpleFOCDebug.cpp>
    +<pwm_driver/stm32g4/>
    +<utils/>
    +<foc_controller/>
    +<interface/>
    +<ldm/>
    +<scan_path/>
    +<pid_control/>
    +<state_machine/>
