; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
lib_archive = false
upload_port = COM4
; src_filter paths are relative to the src/ folder, so drop the leading src/
; current_sense/ is raw imported SimpleFOC code, not yet integrated.
; pwm_driver/stm32g4/ is only valid for STM32G4xx builds.
build_src_filter = +<*> -<current_sense/> -<pwm_driver/stm32g4/> -<tests/ldm/garmin_hardware_test.cpp> -<tests/ldm/garmin_hardware_test.hpp>

[env:stm32g4]
; Compile-check env for the STM32G4 PWM driver subtree only.
; The rest of the firmware (main.cpp, interface, sensor, FOC controller, ...)
; is still Teensy-specific and is excluded from this build.
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
lib_archive = false
build_flags =
    -D USE_FULL_LL_DRIVER
build_src_filter = -<*> +<pwm_driver/> -<pwm_driver/teensy41/> +<_stm32g4_main_stub.cpp>
