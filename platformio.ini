; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 460800
upload_protocol = teensy-gui
lib_archive = false
upload_port = COM4
; src_filter paths are relative to the src/ folder, so drop the leading src/
; current_sense/ base (InlineCurrentSense.cpp Clarke/Park + Teensy zero stub) builds
; here; only the STM32G4 backend under current_sense/stm32g4/ is excluded.
; pwm_driver/stm32g4/ is only valid for STM32G4xx builds.
; Entry point: _teensy_main_stub.cpp (sensor test). Exclude full firmware main.cpp.
build_src_filter = +<*> -<main.cpp> -<current_sense/stm32g4/> -<pwm_driver/stm32g4/> -<tests/ldm/garmin_hardware_test.cpp> -<tests/ldm/garmin_hardware_test.hpp> -<tests/ldm/stm32g4_ldm_test.hpp> -<tests/driver/stm32g4_driver_test.hpp> -<tests/driver/stm32g4_center_aligned_test.hpp> -<tests/driver/stm32g4_safe_stop_test.hpp> -<tests/driver/stm32g4_coil_cogging_test.hpp> -<_stm32g4_main_stub.cpp> -<tests/system/> -<tests/sensor/stm32g4_sensor_test.hpp> -<tests/current_sense/> -<hardware_api.h>

[env:stm32g4]
; Stage bench tests (Nucleo G474RE). Switch active test in _stm32g4_main_stub.cpp.
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 460800
upload_protocol = stlink
upload_port = COM4
lib_archive = false
; L8+ bench: stub + FOCController cascade/current loop + PWM driver.
; setPhaseVoltage() pulls in foc_controller/, sensor/ (AS5048), pid_control/ and
; filter/ (Sensor's LPF/mean/notch). current_sense/ is now included: L11/L12 and
; the closed-current-loop FOC need InlineCurrentSense (base) + the STM32G4 ACS712
; DMA backend (teensy41/ backend is header-only, no .cpp to filter).
build_src_filter =
    -<*>
    +<_stm32g4_main_stub.cpp>
    +<utils/>
    +<hardware_api.h>
    +<pwm_driver/>
    -<pwm_driver/teensy41/>
    +<foc_controller/>
    +<sensor/>
    +<pid_control/>
    +<filter/>
    +<current_sense/>
    +<tests/pwm/>
    +<tests/wiring/>
    +<tests/modulation/>
    +<tests/motor/>
    +<tests/sensor/>
    +<tests/current_sense/>
    +<tests/foc/>
    +<state_machine/>
    +<interface/>
    +<scan_path/>
    +<ldm/LDM.cpp>
